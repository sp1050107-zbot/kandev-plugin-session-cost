id: "kandev-session-cost"
api_version: 1
version: "0.3.1"
display_name: "Session Cost"
description: "Adds a cost icon to the chat bar with pinnable spend details and explicit refresh — resolved from the agent transcript by the tokscale CLI."
author: "kandev"
repo_url: "https://github.com/kdlbs/kandev-plugin-session-cost"
categories: ["analytics"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Read-only access to kandev sessions so the backend can map the composer's
# kandev session id to its agent/ACP transcript id (Host data API). The UI
# only ever sends kandev ids; the transcript join happens server-side.
capabilities:
  api_read: ["sessions"]

webhooks:
  - key: "session-cost"
    description: "Cost of the active chat session as JSON (POST; ?task_id=&active=) — UI request relay, not an external webhook"
    # POST because kandev demands a same-origin signal (Origin header) on
    # session-authenticated webhooks, and browsers omit Origin on same-origin
    # GETs. `access: authenticated` is explicit because api_version 1 would
    # otherwise default the webhook to public, letting any local process
    # trigger a tokscale run. The backend still accepts GET for old bundles.
    method: "POST"
    access: "authenticated"

ui:
  bundle: "/ui/bundle.js"

# Operator settings (Settings > Plugins > Session Cost). Read through the Host
# GetConfig RPC on every webhook call; kandev restarts the plugin whenever the
# operator saves, so changes take effect immediately.
config_schema:
  type: object
  properties:
    command:
      type: string
      title: "tokscale command"
      description: >-
        Command to run the tokscale CLI, e.g. "/usr/local/bin/tokscale".
        Empty = use "tokscale" from the Kandev host's PATH (absolute path);
        if it is not found, nothing runs and the popover shows setup
        guidance. There is no automatic npx download — type an npx command
        here only if you explicitly want that.
    warn_threshold:
      type: number
      title: "Warn threshold (USD)"
      description: "Session cost at or above this turns the amount amber. Default 1."
      default: 1
    high_threshold:
      type: number
      title: "High threshold (USD)"
      description: "Session cost at or above this turns the amount red. Default 10."
      default: 10
